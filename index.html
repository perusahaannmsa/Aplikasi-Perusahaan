<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <title>APK Voucher NMSA - PT. Nusantara Mineral Sukses Abadi</title>
    <meta name="description" content="Aplikasi untuk input data Formulir Pengajuan HO, Bukti Pengeluaran Kas/Bank, SPPD, Internal Memo Direksi, dan Absensi Harian NMSA dengan format cetak resmi." />
    <meta property="og:title" content="APK Voucher NMSA - PT. Nusantara Mineral Sukses Abadi" />
    <meta property="og:description" content="Aplikasi untuk input data Formulir Pengajuan HO, Bukti Pengeluaran Kas/Bank, SPPD, Internal Memo Direksi, dan Absensi Harian NMSA dengan format cetak resmi." />
    <!-- PWA Settings -->
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" type="image/svg+xml" href="icon.svg" />
    <link rel="apple-touch-icon" href="icon.svg" />
    <meta name="theme-color" content="#1c1917" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- GitHub Pages Single Page Apps script for decoding 404 redirects -->
    <script type="text/javascript">
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&')
          }).join('?');
          window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location))
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          const swUrl = new URL('sw.js', window.location.href).href;
          navigator.serviceWorker.register(swUrl)
            .then((reg) => console.log('PWA Service Worker registered successfully:', reg.scope))
            .catch((err) => console.error('PWA Service Worker registration failed:', err));
        });
      }
    </script>
  </body>
</html>
